<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password | livejobs</title>
<meta name="description" content="Choose a new password for your account.">
<meta name="color-scheme" content="light">
<link rel="preload" href="/static/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
<script src="/static/js/theme.js"></script>
<link rel="stylesheet" href="/static/css/site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23f4dc5a'/%3E%3Cpath d='M9 8v16h4V8z M17 14h6v10h-6z' fill='%230f2530'/%3E%3C/svg%3E">
</head>
<body>
<header class="site-head" id="site-head"></header>
<main id="main" class="auth">
<div class="wrap">
  <div>
    <h1>Choose a new password</h1>
    <form id="form" novalidate>
      <div class="field"><label for="password">New password</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="10" required aria-describedby="pw-hint"><p class="hint" id="pw-hint">At least 10 characters.</p></div>
      <p class="form-error" id="error" role="alert"></p>
      <button class="btn btn-stamp" type="submit">Save new password</button>
    </form>
    <div id="bad" hidden>
      <p class="lede">This link doesn’t work.</p>
      <p>It may have expired or already been used. Reset links work once and last an hour.</p>
      <p class="mt5"><a class="btn btn-stamp" href="/forgot">Get a new link</a></p>
    </div>
  </div>
</div>
</main>
<footer class="site-foot" id="site-foot"></footer>
<script type="module" src="/static/js/reset.js"></script>
</body>
</html>
