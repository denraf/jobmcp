<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | livejobs</title>
<meta name="description" content="Sign in to your livejobs portal.">
<meta name="color-scheme" content="light">
<link rel="preload" href="/static/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
<script src="/static/js/theme.js"></script>
<link rel="stylesheet" href="/static/css/site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23f4dc5a'/%3E%3Cpath d='M9 8v16h4V8z M17 14h6v10h-6z' fill='%230f2530'/%3E%3C/svg%3E">
</head>
<body>
<header class="site-head" id="site-head"></header>
<main id="main" class="auth" data-mode="login">
<div class="wrap">
  <div>
    <h1>Sign in</h1>
    <form id="form" novalidate>
      <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <p class="form-ok" id="notice" role="status"></p>
      <p class="form-error" id="error" role="alert"></p>
      <p class="small ui" id="unverified" hidden>Didn’t get the email? <button class="btn-link" id="resend" type="button">Send it again</button>. <span class="form-ok" id="resent" role="status"></span></p>
      <button class="btn btn-stamp" type="submit">Sign in</button>
      <p class="small muted ui mt5"><a href="/forgot">Forgot your password?</a></p>
      <p class="small muted ui">New here? <a href="/register">Create an account</a>.</p>
    </form>
  </div>
  <aside class="auth-aside">
    <h2>Your portal</h2>
    <ul class="plain-list small"><li>Connect your agent</li><li>Set what you’re looking for</li><li>See saved jobs and your application record</li></ul>
  </aside>
</div>
</main>
<footer class="site-foot" id="site-foot"></footer>
<script type="module" src="/static/js/auth.js"></script>
</body>
</html>
