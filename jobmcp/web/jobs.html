<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs | jobmcp</title>
<meta name="description" content="Browse open jobs collected from company career pages.">
<meta name="color-scheme" content="light">
<link rel="preload" href="/static/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
<script src="/static/js/theme.js"></script>
<link rel="stylesheet" href="/static/css/site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23f4dc5a'/%3E%3Cpath d='M9 8v16h4V8z M17 14h6v10h-6z' fill='%230f2530'/%3E%3C/svg%3E">
</head>
<body>
<header class="site-head" id="site-head"></header>
<main id="main">
<div class="wrap">
  <div class="page-head">
    <h1>Jobs</h1>
    <p class="muted">Open roles from employers’ own career pages. You don’t need an account to browse. To save a job or let your agent apply, <a href="/register">create one</a>.</p>
  </div>

  <form class="filters" id="filters" role="search" autocomplete="off">
    <div class="field f-title"><label for="f-title">Job title</label><input class="input" id="f-title" name="title" placeholder="data engineer*" type="search"></div>
    <div class="field f-kw"><label for="f-kw">Keywords in the description</label><input class="input" id="f-kw" name="keywords" placeholder='airflow "machine learning" -intern' type="search"></div>
    <div class="field f-loc"><label for="f-loc">Location</label><input class="input" id="f-loc" name="location" placeholder="Berlin" type="search"></div>
    <div class="field f-vendor"><label for="f-vendor">Hiring platform</label><select class="select" id="f-vendor" name="vendor"><option value="">Any</option></select></div>
    <div class="field f-age"><label for="f-age">Posted</label>
      <select class="select" id="f-age" name="age"><option value="">Any time</option><option value="3">Last 3 days</option><option value="7">Last week</option><option value="30">Last 30 days</option></select></div>
    <div class="field f-level"><label for="f-level">Level</label>
      <select class="select" id="f-level" name="seniority"><option value="">Any</option><option value="intern">Intern</option><option value="entry">Entry level</option><option value="mid">Mid (no level in the title)</option><option value="senior">Senior</option><option value="lead">Lead, principal or manager</option><option value="executive">Director and above</option></select></div>
    <div class="field f-country"><label for="f-country">Country</label>
      <select class="select" id="f-country" name="country"><option value="">Anywhere</option></select></div>
    <div class="field f-remote"><label class="check"><input type="checkbox" id="f-remote" name="remote"> Remote</label>
      <label class="check"><input type="checkbox" id="f-agency" name="noagency"> Hide staffing agencies</label></div>
    <p class="hint span-all">Use quotes for a phrase, <code>*</code> after a word to match its endings (engineer* finds engineering), and <code>-</code> to leave a word out.</p>
  </form>

  <div class="jobs-layout no-detail" id="layout">
    <div>
      <div class="results-bar"><span id="count" aria-live="polite">Loading jobs</span></div>
      <ul class="job-list" id="list"></ul>
      <p class="mt5"><button class="btn btn-quiet" id="more" type="button" hidden>Show more jobs</button></p>
    </div>
    <aside class="detail" id="detail" aria-label="Job details" hidden></aside>
  </div>
</div>
</main>
<footer class="site-foot" id="site-foot"></footer>
<script type="module" src="/static/js/jobs.js"></script>
</body>
</html>
