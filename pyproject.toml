[project]
name = "jobmcp"
version = "0.1.0"
description = "Inventory every ATS job board via Common Crawl, then sweep them with per-vendor parsers."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42",   # pymysql needs it for MySQL 8 caching_sha2_password
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6", "jinja2>=3", "ruff>=0.6"]

[project.scripts]
jobmcp = "jobmcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobmcp*"]

[tool.setuptools.package-data]
jobmcp = ["web/**/*"]

# PEP 8: pycodestyle errors and warnings (E, W), plus pyflakes (F) for unused names. 79 columns, as PEP 8 says.
[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = [".venv", "build"]

[tool.ruff.lint]
select = ["E", "W", "F"]

[tool.ruff.format]
quote-style = "double"
