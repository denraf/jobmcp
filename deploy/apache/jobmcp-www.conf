<VirtualHost *:80>
    ServerAdmin rnijskens@gmail.com
    ServerName www.jobmcp.ai
    ServerAlias jobmcp.ai
    ErrorLog ${APACHE_LOG_DIR}/jobmcp-error.log
    CustomLog ${APACHE_LOG_DIR}/jobmcp-access.log combined

    Protocols h2 http/1.1

    # Everything goes to HTTPS on the canonical host, except the certificate
    # challenge, so renewals keep working.
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://www.jobmcp.ai%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin rnijskens@gmail.com
    ServerName www.jobmcp.ai
    ServerAlias jobmcp.ai
    ErrorLog ${APACHE_LOG_DIR}/jobmcp-error.log
    CustomLog ${APACHE_LOG_DIR}/jobmcp-access.log combined

    Protocols h2 http/1.1

    SSLEngine on
    # Adjust to your certificate. It must cover BOTH www.jobmcp.ai and jobmcp.ai.
    SSLCertificateFile    /etc/letsencrypt/live/www.jobmcp.ai/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.jobmcp.ai/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"

    RewriteEngine on
    # --------------------------------------------------
    # 1. Canonical host redirect (KEEP FIRST), except the MCP endpoint.
    #    Agents send their token in an Authorization header, and a client
    #    drops that header when a redirect crosses to another host. So
    #    /mcp is answered on whichever host it was called on.
    # --------------------------------------------------
    RewriteCond %{HTTP_HOST} !^www\.jobmcp\.ai$ [NC]
    RewriteCond %{REQUEST_URI} !^/mcp(/|$)
    RewriteRule ^ https://www.jobmcp.ai%{REQUEST_URI} [R=301,L]

    # --------------------------------------------------
    # 2. Reverse proxy to jobmcp (127.0.0.1:8000)
    # --------------------------------------------------
    ProxyPreserveHost On

    # jobmcp trusts the FIRST entry of X-Forwarded-For for its login rate
    # limit; set it from the connection so a client can never supply it.
    ProxyAddHeaders Off
    SetEnvIf Remote_Addr "^(.*)$" JOBMCP_CLIENT_IP=$1
    RequestHeader set X-Forwarded-For "%{JOBMCP_CLIENT_IP}e"
    RequestHeader set X-Forwarded-Proto "https"

    # Metrics are for Prometheus on this machine only.
    ProxyPass "/metrics" "!"
    RedirectMatch 404 "^/metrics(/.*)?$"

    # flushpackets: MCP streams its responses. Long timeout for slow searches.
    ProxyPass "/" "http://127.0.0.1:8000/" flushpackets=on timeout=300
    ProxyPassReverse "/" "http://127.0.0.1:8000/"

    LimitRequestBody 1048576
</VirtualHost>
