# /etc/apache2/sites-available/jobmcp.conf
# Then: a2enmod proxy proxy_http headers rewrite ssl setenvif alias; a2ensite jobmcp
# and run `certbot --apache -d YOUR.DOMAIN`, which adds the HTTPS site and the redirect for you.
<VirtualHost *:80>
    ServerName jobmcp.ai
    ErrorLog ${APACHE_LOG_DIR}/jobmcp-error.log
    CustomLog ${APACHE_LOG_DIR}/jobmcp-access.log combined

    ProxyPreserveHost On

    # The client address. jobmcp trusts the FIRST entry of X-Forwarded-For for its login rate limit, and Apache's
    # own header handling keeps whatever the client sent in front of the real address. So switch that off and set
    # the header from the connection itself: a client-supplied value can never survive.
    ProxyAddHeaders Off
    SetEnvIf Remote_Addr "^(.*)$" JOBMCP_CLIENT_IP=$1
    RequestHeader set X-Forwarded-For "%{JOBMCP_CLIENT_IP}e"
    # Evaluated per request, so it is right in the HTTPS copy certbot makes of this site too.
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"

    # Metrics are for Prometheus on this machine only; never serve them to the internet.
    ProxyPass "/metrics" "!"
    RedirectMatch 404 "^/metrics(/.*)?$"

    # flushpackets: MCP over streamable HTTP streams its responses. The long timeout is for slow searches.
    ProxyPass "/" "http://127.0.0.1:8000/" flushpackets=on timeout=300
    ProxyPassReverse "/" "http://127.0.0.1:8000/"

    LimitRequestBody 1048576
</VirtualHost>
