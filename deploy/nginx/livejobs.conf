# /etc/nginx/sites-available/livejobs.conf  (then: ln -s into sites-enabled, and run certbot --nginx)
server {
    listen 80;
    listen [::]:80;
    server_name jobs.example.com;

    # Metrics are for Prometheus on this machine only; never serve them to the internet.
    location = /metrics { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr, not $proxy_add_x_forwarded_for: never pass on a client-supplied header, or the login rate
        # limit can be dodged by sending a different fake address each time.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MCP over streamable HTTP can stream responses; don't buffer them.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    client_max_body_size 1m;
}
