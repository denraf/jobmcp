# Add to your prometheus.yml (or run: prometheus --config.file=this file).
global:
  scrape_interval: 30s

rule_files:
  - /etc/prometheus/livejobs-alerts.yml

scrape_configs:
  # Prometheus on the same machine as livejobs: scrape the app directly (not through the proxy).
  - job_name: livejobs
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]

  # Prometheus on ANOTHER machine: set LIVEJOBS_METRICS_TOKEN, expose the port privately (VPN / firewall rule),
  # and use this instead:
  # - job_name: livejobs
  #   scheme: http
  #   authorization:
  #     type: Bearer
  #     credentials_file: /etc/prometheus/livejobs.token
  #   static_configs:
  #     - targets: ["10.0.0.5:8000"]
