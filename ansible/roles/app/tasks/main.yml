---
- name: System packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - git
      - curl
      - tar
      - acl      # lets Ansible hand files to the unprivileged jobmcp user
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Unprivileged service user
  ansible.builtin.user:
    name: "{{ jobmcp_user }}"
    system: true
    home: "{{ jobmcp_app_dir }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: Folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ jobmcp_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ jobmcp_app_dir }}", owner: "{{ jobmcp_user }}", mode: "0755" }
    - { path: /etc/jobmcp, owner: root, mode: "0750" }

# ── the code ────────────────────────────────────────────────────────────
- name: Pack this checkout (archive mode)
  when: jobmcp_source == 'archive'
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.command:
    argv:
      - tar
      - -czf
      - /tmp/jobmcp-src.tgz
      - -C
      - "{{ playbook_dir }}/.."
      - --exclude=./.venv
      - --exclude=./.git
      - --exclude=./ansible
      - --exclude=./tests
      - --exclude=./.gstack
      - --exclude=./.local
      - --exclude=./.pytest_cache
      - --exclude=./.ruff_cache
      - --exclude=./*.egg-info
      - --exclude=__pycache__
      - .
  environment:
    COPYFILE_DISABLE: "1"    # macOS tar: no ._ metadata files
  changed_when: false

- name: Unpack it on the web server
  when: jobmcp_source == 'archive'
  ansible.builtin.unarchive:
    src: /tmp/jobmcp-src.tgz
    dest: "{{ jobmcp_app_dir }}"
    owner: "{{ jobmcp_user }}"
    group: "{{ jobmcp_user }}"
  register: code_archive
  notify: Restart jobmcp

- name: Fetch the code (git mode)
  when: jobmcp_source == 'git'
  ansible.builtin.git:
    repo: "{{ jobmcp_git_repo }}"
    dest: "{{ jobmcp_app_dir }}"
    version: "{{ jobmcp_git_version }}"
  become_user: "{{ jobmcp_user }}"
  register: code_git
  notify: Restart jobmcp

- name: Python environment and dependencies
  ansible.builtin.pip:
    name: "{{ jobmcp_app_dir }}"
    editable: true
    virtualenv: "{{ jobmcp_app_dir }}/.venv"
    virtualenv_command: python3 -m venv
  become_user: "{{ jobmcp_user }}"
  notify: Restart jobmcp

# ── settings ────────────────────────────────────────────────────────────
- name: Settings file, which holds secrets (root-owned, readable by the service group)
  ansible.builtin.template:
    src: jobmcp.env.j2
    dest: /etc/jobmcp/jobmcp.env
    owner: root
    group: "{{ jobmcp_user }}"
    mode: "0640"
  no_log: true
  notify: Restart jobmcp

- name: Systemd units
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: [jobmcp-web, jobmcp-scheduler]
  notify:
    - Reload systemd
    - Restart jobmcp

# ── database schema and first admin ─────────────────────────────────────
- name: The database server answers
  ansible.builtin.wait_for:
    host: "{{ db_host }}"
    port: "{{ db_port }}"
    timeout: 60

- name: Create or upgrade the tables
  ansible.builtin.command: "{{ jobmcp_app_dir }}/deploy/bin/jobmcp-admin init-db"
  become_user: "{{ jobmcp_user }}"
  register: init_db
  changed_when: false

- name: First admin (an existing account is never changed)
  ansible.builtin.command: >-
    {{ jobmcp_app_dir }}/deploy/bin/jobmcp-admin ensure-admin --email {{ jobmcp_admin_email | quote }}
  become_user: "{{ jobmcp_user }}"
  environment:
    JOBMCP_ADMIN_PASSWORD: "{{ vault_admin_password }}"
  register: ensure_admin
  changed_when: "'created admin' in ensure_admin.stdout"
  no_log: true

# ── start ───────────────────────────────────────────────────────────────
- name: Apply unit changes before starting
  ansible.builtin.meta: flush_handlers

- name: Web app and scheduler are running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [jobmcp-web, jobmcp-scheduler]

- name: The app answers on its local port
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jobmcp_port }}/healthz"
    return_content: true
  register: health
  retries: 20
  delay: 3
  until: health.status == 200

- name: Firewall (SSH, HTTP and HTTPS)
  when: web_manage_firewall | bool
  block:
    - name: Allow SSH first, so enabling the firewall cannot lock you out
      ansible.builtin.command: ufw allow OpenSSH
      register: ufw_ssh
      changed_when: "'Skipping' not in ufw_ssh.stdout"

    - name: Allow web traffic
      ansible.builtin.command: ufw allow 80,443/tcp
      register: ufw_web
      changed_when: "'Skipping' not in ufw_web.stdout"

    - name: Turn the firewall on
      ansible.builtin.command: ufw --force enable
      changed_when: false
