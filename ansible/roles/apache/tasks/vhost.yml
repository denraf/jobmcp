---
- name: Is there a certificate yet?
  ansible.builtin.stat:
    path: "{{ apache_cert_file }}"
  register: cert

- name: Write the livejobs site
  ansible.builtin.template:
    src: livejobs.conf.j2
    dest: /etc/apache2/sites-available/livejobs.conf
    owner: root
    group: root
    mode: "0644"
  vars:
    tls_ready: "{{ cert.stat.exists }}"
  notify: Reload apache2

- name: Enable it, and make sure Apache accepts the whole configuration
  block:
    - name: Enable the site
      ansible.builtin.command: a2ensite livejobs.conf
      args:
        creates: /etc/apache2/sites-enabled/livejobs.conf

    - name: Check the configuration
      ansible.builtin.command: apache2ctl configtest
      changed_when: false
  rescue:
    # Never leave Apache's shared configuration broken: it serves other sites too.
    - name: Take the site out again
      ansible.builtin.command: a2dissite livejobs.conf
      changed_when: true

    - name: Stop here
      ansible.builtin.fail:
        msg: >-
          Apache rejected the livejobs site, so it was disabled again and nothing was reloaded. Run
          `apache2ctl configtest` on the web server for the reason.
