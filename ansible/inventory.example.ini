# Copy to inventory.ini and edit.
#
# private_ip is the address the two machines use to reach each other. Use a private network (the provider's VLAN or
# VPC, or a VPN such as WireGuard), never the public address: the database port is opened to that one address only,
# and its traffic is not encrypted.

[web]
web1 ansible_host=203.0.113.10 private_ip=10.0.0.10

[db]
db1 ansible_host=203.0.113.20 private_ip=10.0.0.20

[all:vars]
ansible_user=ubuntu
